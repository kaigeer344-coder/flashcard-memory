<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>html,body,iframe{margin:0;padding:0;height:100%;width:100%;border:0;display:block}</style></head>
<body>
<script>
// 截图辅助页:种子数据跳过弹层,?screen=xxx 切屏,?js=... 注入表达式,?mode=sprint 冲刺态
var p = new URLSearchParams(location.search);
localStorage.setItem('wordmatch_onboarded', '1');
localStorage.setItem('wordmatch_learning_version', '2');
var today = new Date().toISOString().slice(0, 10);
localStorage.setItem('wordmatch_streak', JSON.stringify({count: 12, lastDate: today, rewardClaimed: true}));
var settings = {
  mode: 'free', activeRoleId: null, activeBookId: 'cet4',
  dailyTarget: 20, defaultView: 'core', showContribution: true,
  reminder: {dailyEnabled: true, dailyTime: '20:00', reviewEnabled: true, examCountdown: true, streakProtection: true},
  audio: {autoPlay: true, speed: 'normal', accent: 'us', volume: 0.8},
  theme: 'default', fontSize: 'standard'
};
if (p.get('mode') === 'sprint') {
  var roles = JSON.parse(localStorage.getItem('wordmatch_roles') || '[]');
  if (roles.length) { settings.mode = 'sprint'; settings.activeRoleId = roles[0].id; }
}
localStorage.setItem('wordmatch_settings', JSON.stringify(settings));
var f = document.createElement('iframe');
f.src = '闪卡记忆.html';
f.onload = function () {
  var w = f.contentWindow;
  var screen = p.get('screen');
  var js = p.get('js');
  setTimeout(function () {
    try {
      if (screen) {
        if (w.navigateToScreen) w.navigateToScreen(screen);
        else if (w.showScreen) w.showScreen(screen);
      }
      if (js) w.eval(decodeURIComponent(js));
    } catch (e) { document.title = 'ERR:' + e.message; }
  }, 900);
};
document.body.appendChild(f);
</script>
</body>
</html>
